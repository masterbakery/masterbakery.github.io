<!DOCTYPE html>
<!-- ============================================================
     Master Bakery — PONTE per i QR già stampati
     Aggiornato al 04/06/2026 10:42 (ora Roma) · v2.0
     I QR su locandine/banco puntano qui (feedback.html?pv=m178|mulino|puntogusto).
     Questa pagina NON mostra più nulla: reindirizza all'HUB (index.html) in
     modalità "negozio" con l'etichetta giusta (?s=qr-banco-<pv>), così i QR
     già in giro restano validi senza ristamparli.
     ============================================================ -->
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Master Bakery</title>
<style>
  html,body{height:100%}
  body{margin:0;display:flex;align-items:center;justify-content:center;
    background:#FAF1DD;color:#4A2317;
    font-family:Georgia,'Times New Roman',serif;text-align:center;padding:24px}
  .box{max-width:340px}
  .box h1{font-size:22px;margin:0 0 8px}
  .box p{font-size:14px;color:#6B5444;margin:0 0 16px}
  .box a{color:#4A2317;font-weight:bold}
</style>
<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var pv = (params.get('pv') || '').toLowerCase();
  // Mappa le vecchie chiavi ?pv= sulle etichette QR-negozio dell'hub
  var map = { m178:'qr-banco-m178', mulino:'qr-banco-mulino', puntogusto:'qr-banco-pg' };
  var s = map[pv] || 'qr-banco';
  // Reindirizza all'hub (replace = non sporca la cronologia / no loop col "back")
  window.location.replace('index.html?s=' + s);
})();
</script>
</head>
<body>
  <div class="box">
    <h1>Master Bakery</h1>
    <p>Ti stiamo portando alla pagina…</p>
    <!-- Fallback se il redirect automatico non parte (JS disattivato) -->
    <p><a href="index.html?s=qr-banco">Tocca qui per continuare →</a></p>
  </div>
</body>
</html>
